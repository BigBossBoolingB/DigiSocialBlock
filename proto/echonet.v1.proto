syntax = "proto3";

package echonet.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/BigBossBoolingB/Digital-Golem-Engine/pkg/proto/echonet/v1";

// PeerInfo contains the necessary information for a node to connect to a peer.
message PeerInfo {
  // The sovereign user_id of the peer, linking network identity to the identity layer.
  string user_id = 1;

  // The multiaddress that the peer is listening on.
  // e.g., "/ip4/192.168.1.100/tcp/4001"
  string multiaddress = 2;

  // The list of Frequencies of Resonance the peer is interested in.
  repeated string frequencies = 3;
}

// AnnounceRequest is the message a node broadcasts to announce its presence.
// It contains the sender's PeerInfo and is signed to prove authenticity.
message AnnounceRequest {
  // The information about the peer making the announcement.
  PeerInfo peer_info = 1;

  // The timestamp of the announcement.
  google.protobuf.Timestamp timestamp = 2;

  // The cryptographic signature of the serialized PeerInfo and timestamp,
  // created using the announcer's private key. This proves ownership of the user_id.
  bytes signature = 3;
}

// FindPeersRequest is a message sent to the DHT to find peers for specific frequencies.
message FindPeersRequest {
  // The frequency of interest.
  string frequency = 1;
}

// FindPeersResponse is the reply containing a list of peers for a given frequency.
message FindPeersResponse {
  // A list of peers interested in the requested frequency.
  repeated PeerInfo peers = 1;
}