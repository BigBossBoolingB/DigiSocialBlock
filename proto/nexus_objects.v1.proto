syntax = "proto3";

package nexus.v1;

import "google/protobuf/timestamp.proto";

option go_package = "github.com/BigBossBoolingB/Digital-Golem-Engine/pkg/proto/nexus/v1";

// NexusUserObjectV1 represents a sovereign user identity on the network.
// This object defines the core, on-chain attributes of a user.
message NexusUserObjectV1 {
  // A unique, immutable identifier for the user (e.g., a UUID).
  string user_id = 1;

  // The user's public key, used for signing content and verifying identity.
  // This is the cryptographic foundation of their sovereignty.
  bytes public_key = 2;

  // The user's chosen handle or username. Must be unique across the network.
  string handle = 3;

  // The timestamp when the user profile was created on-chain.
  google.protobuf.Timestamp created_at = 4;

  // A URI (e.g., Arweave or IPFS) pointing to an off-chain JSON object
  // containing mutable metadata like display name, bio, and avatar.
  string metadata_uri = 5;
}

// NexusContentObjectV1 represents a piece of content created by a user.
// This is the immutable, on-chain record of a publication.
message NexusContentObjectV1 {
  // A unique, immutable identifier for the content object.
  string content_id = 1;

  // The user_id of the author. This links the content to its sovereign creator.
  string author_user_id = 2;

  // The timestamp when the content was published on-chain.
  google.protobuf.Timestamp created_at = 3;

  // A URI pointing to the actual content body, which is stored off-chain
  // (e.g., on Arweave or another decentralized storage solution).
  string content_body_uri = 4;

  // The MIME type of the off-chain content (e.g., "text/markdown", "image/png").
  // This helps clients render the content correctly.
  string mime_type = 5;

  // Frequencies of Resonance (tags) associated with the content, used for
  // filtering and discovery in the "Resonant Conduit".
  repeated string frequencies = 6;
}